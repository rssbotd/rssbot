[build-system]
requires = [
    'setuptools>=64.0.0',
    'wheel'
]
build-backend = 'setuptools.build_meta'


[project]
name = 'rssbot'
description = '24/7 IRC Feed Fetcher, a contribution back to society.'
version = '658'
authors = [
    {name = 'Bart Thate',email = 'rssbotd@gmail.com'},
]
readme = 'README.rst'
license = 'Unlicense'
classifiers = [ 
    'Development Status :: 4 - Beta',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Topic :: Utilities'
]


[project.scripts]
"rssbot" = "rssbot.runtime:main"


[project.urls]
'home'   = 'https://pypi.org/project/rssbot'
'bugs'   = 'https://github.com/rssbotd/rssbot/issues'
'source' = 'https://github.com/rssbotd/rssbot'


[tool.setuptools]
packages=[
    'rssbot',
    'rssbot.modules',
    'rssbot.network'
]


[tool.pylint."messages control"]
disable = ["C,R,W,E0401,E0402"]


[tool.ruff.lint]
ignore = ["E402", "E501", "E701", "E702"]

[build-system]
requires = [
    'setuptools>=64.0.0',
    'wheel'
]
build-backend = 'setuptools.build_meta'


[project]
name = 'rssbot'
description = '24/7 IRC Feed Fetcher'
version = '658'
authors = [
    {name = 'Bart Thate',email = 'rssbotd@gmail.com'},
]
readme = 'README.rst'
license = 'Unlicense'
classifiers = [ 
    'Development Status :: 4 - Beta',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Topic :: Utilities'
]


[project.scripts]
"rssbot" = "rssbot.runtime:main"


[project.urls]
'home'   = 'https://pypi.org/project/rssbot'
'bugs'   = 'https://github.com/rssbotd/rssbot/issues'
'source' = 'https://github.com/rssbotd/rssbot'


[tool.setuptools]
packages=[
    'rssbot',
    'rssbot.minimal',
    'rssbot.mirrors',
    'rssbot.modules',
    'rssbot.neurons',
    'rssbot.numbers'
]


[tool.pylint."messages control"]
disable = [
    'R',
    'invalid-name',
    'line-too-long',
    'import-outside-toplevel',
    'broad-exception-caught',
    'relative-beyond-top-level'
]

[tool.ruff.lint]
preview = true
ignore = [
    'DTZ',
    'deprecated-import',
    'blind-except',
    'invalid-all-format',
    'mutable-class-default',
    'non-pep585-annotation',
    'unsorted-imports',
    'verbose-log-message'
]

[build-system]
requires = [
    'setuptools>=64.0.0',
    'wheel'
]
build-backend = 'setuptools.build_meta'


[project]
name = 'rssbot'
description = '24/7 IRC Feed Fetcher'
version = '658'
authors = [
    {name = 'Bart Thate',email = 'rssbotd@gmail.com'},
]
readme = 'README.rst'
license = 'Unlicense'
classifiers = [ 
    'Development Status :: 4 - Beta',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Topic :: Utilities'
]


[project.scripts]
"rssbot" = "rssbot.runtime:main"


[project.urls]
'home'   = 'https://github.com/rssbotd/rssbot'
'bugs'   = 'https://github.com/rssbotd/rssbot/issues'
'source' = 'https://github.com/rssbotd/rssbot'


[tool.setuptools]
packages=[
    'rssbot',
    'rssbot.minimal',
    'rssbot.modules',
    'rssbot.namings',
    'rssbot.network'
]


[tool.pylint."messages control"]
disable = [
    'R',
    'attribute-defined-outside-init',
    'broad-exception-caught',
    'invalid-name',
    'import-outside-toplevel',
    'line-too-long',
    'protected-access',
    'relative-beyond-top-level',
    'unused-argument'
]


[tool.ruff.lint]
preview = true
ignore = [
    'DTZ',
    'deprecated-import',
    'blind-except',
    'invalid-all-format',
    'mutable-class-default',
    'non-pep585-annotation',
    'non-pep604-annotation-union',
    'unsorted-imports',
    'verbose-log-message'
]


[tool.mypy]
disable_error_code = [
    'annotation-unchecked',
    'var-annotated'
]
